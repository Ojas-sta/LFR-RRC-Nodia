; ==============================================================================
; PlatformIO Configuration for LFR-RRC-Nodia
; Dual-Core High-Speed Line Following Robot (ESP32 / Arduino-ESP32 3.x)
; ==============================================================================

[platformio]
default_envs = esp32dev
description = Dual-Core ESP32 Line Following Robot Firmware (Core 1 = LFR, Core 0 = WiFi/Web)

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32.git#51.03.07
board = esp32dev
framework = arduino

; Serial Upload & Monitor settings
monitor_speed = 115200
upload_speed = 921600

; Compiler optimizations for competition real-time control
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUHAL_LOG_COLORS=0
